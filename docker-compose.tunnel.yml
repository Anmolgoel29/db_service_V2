# Optional overlay: reach the two UIs over a Cloudflare Tunnel instead of
# opening ports. Nothing listens publicly — cloudflared dials out.
#
#   1. Cloudflare Zero Trust → Networks → Tunnels → create a tunnel, copy token
#   2. put CLOUDFLARE_TUNNEL_TOKEN=... in .env
#   3. add to .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.tunnel.yml
#   4. ./dbctl.sh up
#   5. in the tunnel's Public Hostname tab, add two routes:
#        <name>-db.solveease.in   →  HTTP  →  pg-view:3000
#        <name>-bk.solveease.in   →  HTTP  →  pgbackweb:8085
#
# Keep hostnames ONE label deep (dash, not dot) — same Cloudflare Universal SSL
# wildcard constraint documented in db_service (V1).
#
# Both UIs have their own login, but a tunnel puts them on the public internet;
# adding a Cloudflare Access policy in front is the sane default.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dbfarm-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks: [dbfarm]
